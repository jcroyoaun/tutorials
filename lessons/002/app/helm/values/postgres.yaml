global:
  tag: "16.8-alpine3.20"

service:
  name: postgres
  persistence:
    enabled: false
  volumes:
    - name: db-schema-volume
      configMap:
        name: postgres-config-file

  container:
    image: postgres
    port: 5432
    volumeMounts:
      - name: db-schema-volume
        mountPath: /docker-entrypoint-initdb.d/schema.sql
        subPath: schema.sql
    envFrom:
      - secretRef:
          name: postgres-secrets
  configFiles:
    schema.sql: |-
      CREATE DATABASE "exerciselib";
      \c exerciselib
      CREATE ROLE exerciselib WITH LOGIN PASSWORD 'pa55word';
      GRANT ALL PRIVILEGES ON DATABASE exerciselib TO exerciselib;
      GRANT ALL PRIVILEGES ON SCHEMA public TO exerciselib;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO exerciselib;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO exerciselib;
      
      -- Switch to the exerciselib user for the table creation
      SET ROLE exerciselib;
      
      CREATE TABLE IF NOT EXISTS exercises (
          id bigserial PRIMARY KEY,
          created_at timestamp(0) with time zone NOT NULL DEFAULT NOW(),
          name text NOT NULL,
          primarymuscles text[] NOT NULL,
          secondarymuscles text[],
          version integer NOT NULL DEFAULT 1
      );
      
      -- Reset back to postgres role
      RESET ROLE;

  secretData:
    POSTGRES_PASSWORD: "pa55word"


  networkPolicy:
    enabled: true
    ingress:
      - fromEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: kube-system
              k8s-app: kube-dns
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
            rules:
              dns:
                - matchPattern: "*"
      - fromEndpoints:
          - matchLabels:
              app: exerciselib
              io.kubernetes.pod.namespace: exerciselib
        toPorts:
          - ports:
              - port: "5432"
                protocol: TCP
    egress:
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: kube-system
              k8s-app: kube-dns
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
            rules:
              dns:
                - matchPattern: "*"
