apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: service-discovery

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/name: posadev-go-sentinel
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: true

