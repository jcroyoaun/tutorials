apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-sentinel
  namespace: default
  labels:
    app.kubernetes.io/name: posadev-go-sentinel
    app.kubernetes.io/component: sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: posadev-go-sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posadev-go-sentinel
        app.kubernetes.io/component: sentinel
    spec:
      serviceAccountName: go-k8s-sentinel-sa
      
      containers:
        - name: sentinel
          image: 443311183770.dkr.ecr.us-east-1.amazonaws.com/go_k8s_sentinel:latest
          imagePullPolicy: Always
          
          envFrom:
            - configMapRef:
                name: go-sentinel-config
          
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      
      # Pod-level security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      
      # Tolerate scheduling on any node
      tolerations:
        - operator: Exists

