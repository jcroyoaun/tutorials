apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: go-sentinel-reader
  labels:
    app.kubernetes.io/name: posadev-go-sentinel
    app.kubernetes.io/component: rbac
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: go-sentinel-reader-binding
  labels:
    app.kubernetes.io/name: posadev-go-sentinel
    app.kubernetes.io/component: rbac
subjects:
  - kind: ServiceAccount
    name: go-k8s-sentinel-sa
    namespace: service-discovery
roleRef:
  kind: ClusterRole
  name: go-sentinel-reader
  apiGroup: rbac.authorization.k8s.io

