apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-sentinel
  namespace: default
  labels:
    app.kubernetes.io/name: posadev-go-sentinel
    app.kubernetes.io/component: sentinel
  annotations:
    # AWS ALB Ingress Controller annotations
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    
    # External DNS annotation for automatic DNS record creation
    external-dns.alpha.kubernetes.io/hostname: servicediscovery.posadev.jcroyoaun.com
spec:
  ingressClassName: alb
  rules:
    - host: servicediscovery.posadev.jcroyoaun.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-sentinel
                port:
                  number: 80

