# THE TROUBLEMAKER - Chaos Agent
# Burstable with MASSIVE overcommit (64Mi request, 4Gi limit)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hog-troublemaker
  namespace: qos-demo
  labels:
    app: resource-hog
    qos: burstable
    role: troublemaker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resource-hog
      role: troublemaker
  template:
    metadata:
      labels:
        app: resource-hog
        qos: burstable
        role: troublemaker
    spec:
      containers:
      - name: resource-hog
        image: 443311183770.dkr.ecr.us-east-1.amazonaws.com/resource-hog:latest
        ports:
        - containerPort: 8080
          name: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        # MASSIVE overcommit - 62x on memory!
        resources:
          requests:
            memory: "345Mi"
            cpu: "100m"
          limits:
            memory: "5Gi"
            cpu: "3000m"
---
apiVersion: v1
kind: Service
metadata:
  name: hog-troublemaker
  namespace: qos-demo
spec:
  selector:
    app: resource-hog
    role: troublemaker
  ports:
  - port: 8080
    targetPort: 8080
    name: http
